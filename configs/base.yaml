app:
  name: ragassistant
  environment: development

retrieval:
  device: auto  # auto-selects cuda if available, otherwise cpu
  embedding_model: BAAI/bge-base-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  chunk_size: 500
  chunk_overlap: 100
  top_k_candidates: 10
  top_k_reranked: 3
  relevance_threshold: 0.35  # below this score, system triggers refusal

generation:
  model: llama-3.1-8b-instant
  provider: groq  # groq | openai | mock
  temperature: 0.1
  max_tokens: 512

storage:
  chroma_db_dir: data/chroma_db
  sample_docs_dir: data/sample_docs
