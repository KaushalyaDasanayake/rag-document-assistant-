[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragassistant"
version = "0.1.0"
description = "Production RAG Document Assistant with Citations, Refusal Mechanism, and Cost Tracing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0.1",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "pypdf>=4.2.0",
  "torch>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "httpx>=0.27",
  "streamlit>=1.30.0",
  "groq>=0.9.0",
  "openai>=1.30.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "anyio>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
